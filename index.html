<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIYAHE - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<div class="auth-shell"><div class="auth-wrap">
  <div class="auth-pill"><span class="dot"></span>Official Transit Gateway</div>
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" fill="#dc2626"/><circle cx="12" cy="10" r="3" fill="#1d4ed8"/></svg></div>
      <div class="auth-title">BIYAHE</div>
      <p class="auth-sub">Admin Portal Login</p>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <div id="errorMsg" class="msg error"></div>
      <div id="successMsg" class="msg success">Login successful. Redirecting...</div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input class="input" type="text" id="username" placeholder="Enter username" autocomplete="username" required /></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap has-toggle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input class="input" type="password" id="password" placeholder="Enter password" autocomplete="current-password" required /><button type="button" class="pw-toggle" data-toggle="password" aria-label="Show or hide password"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
      <div class="row-between"><label class="check"><input type="checkbox" id="remember" />Remember my username</label><a href="forgot-password.html" class="link-sm">Forgot password?</a></div>

      <button type="submit" class="btn btn-primary" id="loginBtn"><span class="label">Login</span><div class="spinner"></div></button>
    </form>

    <div class="status-panel" id="statusPanel">
      <div class="sp-icon" id="spIcon"></div>
      <h3 id="spTitle"></h3>
      <p id="spText"></p>
      <span class="chip" id="spBadge"></span><br/>
      <button class="btn btn-primary" id="spBack" type="button">Back to Login</button>
    </div>

    <p class="auth-foot" id="loginFoot">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
  <p class="trust">Authorized personnel only</p>
</div></div>

<script src="api-config.js"></script>
<script>
(function () { try { document.documentElement.setAttribute('data-theme', localStorage.getItem('biyahe-theme') || 'light'); } catch (e) {} })();
const EYE = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', EYEOFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
document.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
  const input = document.getElementById(btn.dataset.toggle);
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  btn.querySelector('svg').innerHTML = hidden ? EYEOFF : EYE;
}));
const STATUS_ICONS = { waiting: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', blocked: '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>' };
function setIcon(el, kind) { el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + STATUS_ICONS[kind] + '</svg>'; }

function showStatusPanel(blocked) {
  const p = document.getElementById('statusPanel');
  p.className = 'status-panel show ' + (blocked ? 'blocked' : 'waiting');
  setIcon(document.getElementById('spIcon'), blocked ? 'blocked' : 'waiting');
  document.getElementById('spTitle').textContent = blocked ? 'Account blocked' : 'Waiting for approval';
  document.getElementById('spText').textContent = blocked
    ? 'A superadmin has blocked this account. Contact a superadmin if you think this is a mistake.'
    : 'Your account has been created, but a superadmin has not approved it yet. You can log in once it is approved.';
  const b = document.getElementById('spBadge');
  b.className = 'chip ' + (blocked ? 'chip-danger' : 'chip-warn');
  b.textContent = 'Status: ' + (blocked ? 'Blocked' : 'Waiting Approval');
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('loginFoot').style.display = 'none';
}
document.getElementById('spBack').addEventListener('click', () => {
  document.getElementById('statusPanel').className = 'status-panel';
  document.getElementById('loginForm').style.display = '';
  document.getElementById('loginFoot').style.display = '';
});

document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errorMsg'), ok = document.getElementById('successMsg');
  const form = document.getElementById('loginForm'), btn = document.getElementById('loginBtn');
  err.classList.remove('show'); ok.classList.remove('show');
  if (!username || !password) { err.textContent = 'Enter your username and password.'; err.classList.add('show'); return; }

  form.classList.add('submitting'); btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password })
    });
    let result = {};
    try { result = await res.json(); } catch (e) {}

    if (res.status === 403) { showStatusPanel(/blocked/i.test(result.message || '')); return; }
    if (result.success) {
      try { sessionStorage.setItem('biyahe_admin_role', (result.admin && result.admin.role) || 'admin'); } catch (e) {}
      if (document.getElementById('remember').checked) localStorage.setItem('biyahe_user', username);
      else localStorage.removeItem('biyahe_user');
      ok.classList.add('show');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
      return;
    }
    err.textContent = result.message || 'Invalid username or password.'; err.classList.add('show');
  } catch (e) {
    err.textContent = 'Could not reach the server. Please try again.'; err.classList.add('show');
  } finally {
    form.classList.remove('submitting'); btn.disabled = false;
  }
});

const remembered = localStorage.getItem('biyahe_user');
if (remembered) { document.getElementById('username').value = remembered; document.getElementById('remember').checked = true; }
</script>
</body>
</html>
