<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIYAHE - Ratings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="app_shell.css" />
  <link rel="stylesheet" href="ratings.css" />
  <script src="api-config.js"></script>
  <script src="shell.js"></script>
</head>
<body data-page="ratings">
<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="app-main">
    <header id="topbarMount"></header>

    <main class="page">
      <div class="page-head">
        <div><h1>Ratings &amp; Reviews</h1><p class="sub">What commuters say about route and fare accuracy.</p></div>
        <div class="page-actions"><button class="btn btn-outline" id="exportBtn" type="button"></button></div>
      </div>

      <section class="stat-grid">
        <div class="stat-card">
          <div><p class="stat-label">Total Reviews</p><p class="stat-value" id="cntTotal" data-skel>0</p><p class="stat-note">One per commuter per route</p></div>
          <div class="stat-icon" data-icon="message"></div>
        </div>
        <div class="stat-card">
          <div><p class="stat-label">Route Accuracy</p><p class="stat-value" id="avgRoute" data-skel>-</p><p class="stat-note">Average out of 5</p></div>
          <div class="stat-icon green" data-icon="route"></div>
        </div>
        <div class="stat-card">
          <div><p class="stat-label">Fare Accuracy</p><p class="stat-value" id="avgFare" data-skel>-</p><p class="stat-note">Average out of 5</p></div>
          <div class="stat-icon amber" data-icon="star"></div>
        </div>
        <div class="stat-card">
          <div><p class="stat-label">With Comments</p><p class="stat-value" id="cntComments" data-skel>0</p><p class="stat-note" id="commentNote" data-skel>&nbsp;</p></div>
          <div class="stat-icon red" data-icon="users"></div>
        </div>
      </section>

      <div class="toolbar">
        <div class="search-box"></div>
        <select class="select" id="routeFilter" style="width:auto;"><option value="">All routes</option></select>
        <select class="select" id="starFilter" style="width:auto;">
          <option value="">Any rating</option>
          <option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option>
        </select>
        <select class="select" id="sortSelect" style="width:auto;">
          <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
          <option value="high">Highest rated</option><option value="low">Lowest rated</option>
        </select>
        <label class="check" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);"><input type="checkbox" id="commentOnly" /> With comments only</label>
        <div class="seg view-seg" id="viewSeg">
          <button class="is-active" data-view="reviews">Reviews</button>
          <button data-view="routes">By Route</button>
        </div>
      </div>
      <span class="count-note" id="countNote">Loading reviews...</span>

      <div class="rv-list" id="reviewList"><div class="sk-wrap"><div class="sk-row"><span class="sk-circle" style="width:38px;height:38px"></span><div class="sk-col"><span class="sk-line" style="width:40%"></span><span class="sk-line" style="width:70%;height:10px"></span></div></div><div class="sk-row"><span class="sk-circle" style="width:38px;height:38px"></span><div class="sk-col"><span class="sk-line" style="width:40%"></span><span class="sk-line" style="width:70%;height:10px"></span></div></div><div class="sk-row"><span class="sk-circle" style="width:38px;height:38px"></span><div class="sk-col"><span class="sk-line" style="width:40%"></span><span class="sk-line" style="width:70%;height:10px"></span></div></div></div></div>

      <div class="sum-card" id="routeSummary" style="display:none;">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Route</th><th>Corridor</th><th class="num">Reviews</th><th>Route Accuracy</th><th>Fare Accuracy</th></tr></thead>
            <tbody id="routeSummaryBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const { api, escapeHtml, showToast, icon, initials, exportCsv } = Biyahe;

let all = [];
let view = 'reviews';

document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, 'lg'); });
document.getElementById('exportBtn').innerHTML = icon('download', 'sm') + '<span>Export CSV</span>';
document.querySelector('.search-box').innerHTML = icon('search', 'sm') + '<input type="text" id="searchInput" placeholder="Search user, route or comment..." />';

function stars(n, label) {
  const v = Math.round(n || 0);
  let out = '';
  for (let i = 1; i <= 5; i++) out += `<svg viewBox="0 0 24 24" class="${i <= v ? 'on' : ''}" aria-hidden="true">${'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'}</svg>`;
  return `<span class="stars" role="img" aria-label="${label ? escapeHtml(label) + ': ' : ''}${v} out of 5">${out}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const overall = r => (r.route_accuracy_rating + r.fare_accuracy_rating) / 2;

function filtered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const route = document.getElementById('routeFilter').value;
  const star = document.getElementById('starFilter').value;
  const withC = document.getElementById('commentOnly').checked;
  const sort = document.getElementById('sortSelect').value;
  let rows = all.filter(r =>
    (!route || String(r.route_id) === route) &&
    (!star || Math.round(overall(r)) === Number(star)) &&
    (!withC || r.comment) &&
    (!q || [r.username, r.route_code, r.origin_name, r.destination_name, r.comment || ''].some(t => String(t).toLowerCase().includes(q))));
  rows = rows.slice().sort((a, b) => {
    if (sort === 'oldest') return new Date(a.date_updated) - new Date(b.date_updated);
    if (sort === 'high') return overall(b) - overall(a) || new Date(b.date_updated) - new Date(a.date_updated);
    if (sort === 'low') return overall(a) - overall(b) || new Date(b.date_updated) - new Date(a.date_updated);
    return new Date(b.date_updated) - new Date(a.date_updated);
  });
  return rows;
}

function renderReviews(rows) {
  const box = document.getElementById('reviewList');
  if (!rows.length) { box.innerHTML = '<div class="empty-card">' + (all.length ? 'No reviews match your filters.' : 'No reviews yet. They will appear here once commuters rate a route.') + '</div>'; return; }
  box.innerHTML = rows.map(r => {
    const edited = r.date_updated && r.date_created && r.date_updated !== r.date_created && Math.abs(new Date(r.date_updated) - new Date(r.date_created)) > 60000;
    return `<article class="rv-card">
      <div class="rv-top">
        <div class="rv-avatar">${escapeHtml(initials(r.username))}</div>
        <div class="rv-who"><div class="name">${escapeHtml(r.username)}</div>
          <div class="when">${escapeHtml(fmtDate(r.date_updated))}${edited ? ' <span class="edited">(edited)</span>' : ''}</div></div>
        <div class="rv-route"><span class="route-code-tile">${escapeHtml(r.route_code)}</span>
          <span class="corridor">${escapeHtml(r.origin_name)} to ${escapeHtml(r.destination_name)}</span></div>
      </div>
      <div class="rv-scores">
        <div class="rv-score"><div class="lbl">Route accuracy</div><div class="val">${stars(r.route_accuracy_rating, 'Route accuracy')}<span>${r.route_accuracy_rating}/5</span></div></div>
        <div class="rv-score"><div class="lbl">Fare accuracy</div><div class="val">${stars(r.fare_accuracy_rating, 'Fare accuracy')}<span>${r.fare_accuracy_rating}/5</span></div></div>
      </div>
      ${r.comment ? `<div class="rv-comment">${escapeHtml(r.comment)}</div>` : '<div class="rv-nocomment">No written comment.</div>'}
    </article>`;
  }).join('');
}

function routeGroups(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!m.has(r.route_id)) m.set(r.route_id, { id: r.route_id, code: r.route_code, corridor: `${r.origin_name} to ${r.destination_name}`, n: 0, route: 0, fare: 0 });
    const g = m.get(r.route_id); g.n++; g.route += r.route_accuracy_rating; g.fare += r.fare_accuracy_rating;
  });
  return [...m.values()].map(g => Object.assign(g, { avgRoute: g.route / g.n, avgFare: g.fare / g.n })).sort((a, b) => b.n - a.n);
}
function renderByRoute(rows) {
  const groups = routeGroups(rows);
  document.getElementById('routeSummaryBody').innerHTML = groups.length ? groups.map(g => `<tr>
    <td><span class="route-code-tile">${escapeHtml(g.code)}</span></td>
    <td>${escapeHtml(g.corridor)}</td>
    <td class="num">${g.n}</td>
    <td><span class="avg-cell">${stars(g.avgRoute)}<b>${g.avgRoute.toFixed(1)}</b></span></td>
    <td><span class="avg-cell">${stars(g.avgFare)}<b>${g.avgFare.toFixed(1)}</b></span></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">No reviews match your filters.</td></tr>';
}

function render() {
  const rows = filtered();
  document.getElementById('countNote').textContent = `${rows.length} of ${all.length} review${all.length === 1 ? '' : 's'}`;
  document.getElementById('reviewList').style.display = view === 'reviews' ? '' : 'none';
  document.getElementById('routeSummary').style.display = view === 'routes' ? '' : 'none';
  if (view === 'reviews') renderReviews(rows); else renderByRoute(rows);
}

function renderSummary(s) {
  document.getElementById('cntTotal').textContent = s.total.toLocaleString();
  document.getElementById('avgRoute').textContent = s.average_route_accuracy == null ? '-' : s.average_route_accuracy.toFixed(1);
  document.getElementById('avgFare').textContent = s.average_fare_accuracy == null ? '-' : s.average_fare_accuracy.toFixed(1);
  document.getElementById('cntComments').textContent = s.with_comments.toLocaleString();
  document.getElementById('commentNote').textContent = s.total ? (s.with_comments / s.total * 100).toFixed(0) + '% left a comment' : 'No reviews yet';
}

function fillRouteFilter() {
  const seen = new Map();
  all.forEach(r => { if (!seen.has(r.route_id)) seen.set(r.route_id, r.route_code + ' - ' + r.origin_name + ' to ' + r.destination_name); });
  document.getElementById('routeFilter').innerHTML = '<option value="">All routes</option>' +
    [...seen.entries()].map(([id, label]) => `<option value="${id}">${escapeHtml(label)}</option>`).join('');
}

async function load() {
  try {
    const data = await api('/api/admin/ratings');
    all = data.ratings || [];
    renderSummary(data.summary || { total: 0, with_comments: 0 });
    fillRouteFilter();
    render();
  } catch (e) {
    showToast(e.message, 'error');
    document.getElementById('countNote').textContent = 'Could not load reviews';
    document.getElementById('reviewList').innerHTML = '<div class="empty-card">Could not load reviews. ' + escapeHtml(e.message) + '</div>';
  }
}

['searchInput', 'routeFilter', 'starFilter', 'sortSelect', 'commentOnly'].forEach(id => {
  const el = document.getElementById(id); el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', render);
});
document.getElementById('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('is-active', x === b));
  view = b.dataset.view; render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  exportCsv('ratings', filtered(), [
    { header: 'Route Code', value: r => r.route_code },
    { header: 'Origin', value: r => r.origin_name },
    { header: 'Destination', value: r => r.destination_name },
    { header: 'Commuter', value: r => r.username },
    { header: 'Route Accuracy (1-5)', value: r => r.route_accuracy_rating },
    { header: 'Fare Accuracy (1-5)', value: r => r.fare_accuracy_rating },
    { header: 'Comment', value: r => r.comment || '' },
    { header: 'First Rated', value: r => r.date_created || '' },
    { header: 'Last Updated', value: r => r.date_updated || '' }
  ]);
});

Biyahe.ready.then(load);
</script>
</body>
</html>
