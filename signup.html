<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIYAHE - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<div class="auth-shell"><div class="auth-wrap">
  <div class="auth-pill"><span class="dot"></span>Official Transit Gateway</div>
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" fill="#dc2626"/><circle cx="12" cy="10" r="3" fill="#1d4ed8"/></svg></div>
      <div class="auth-title">BIYAHE</div>
      <p class="auth-sub">Create an admin account</p>
    </div>

    <form class="auth-form" id="signupForm" novalidate>
      <div id="signupError" class="msg error"></div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input class="input" type="text" id="username" placeholder="Choose a username" autocomplete="username" minlength="3" required /></div>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><input class="input" type="email" id="email" placeholder="admin@example.com" autocomplete="email" required /></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap has-toggle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input class="input" type="password" id="password" placeholder="Enter password" autocomplete="new-password" required /><button type="button" class="pw-toggle" data-toggle="password" aria-label="Show or hide password"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="input-wrap has-toggle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input class="input" type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password" required /><button type="button" class="pw-toggle" data-toggle="confirm" aria-label="Show or hide password"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>

      <button type="submit" class="btn btn-primary" id="signupBtn"><span class="label">Sign Up</span><div class="spinner"></div></button>
    </form>

    <div class="status-panel waiting" id="waitingPanel">
      <div class="sp-icon" id="spIcon"></div>
      <h3>Account created, waiting for approval</h3>
      <p>A superadmin needs to approve your account before you can log in.</p>
      <p id="waitingWho"></p>
      <span class="chip chip-warn">Status: Waiting Approval</span><br/>
      <a class="btn btn-primary" href="index.html">Back to Login</a>
    </div>

    <p class="auth-foot" id="signupFoot">Already have an account? <a href="index.html">Login</a></p>
  </div>
  <p class="trust">Authorized personnel only</p>
</div></div>

<script src="api-config.js"></script>
<script>
(function () { try { document.documentElement.setAttribute('data-theme', localStorage.getItem('biyahe-theme') || 'light'); } catch (e) {} })();
const EYE = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', EYEOFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
document.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
  const input = document.getElementById(btn.dataset.toggle);
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  btn.querySelector('svg').innerHTML = hidden ? EYEOFF : EYE;
}));
const STATUS_ICONS = { waiting: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', blocked: '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>' };
function setIcon(el, kind) { el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + STATUS_ICONS[kind] + '</svg>'; }

document.getElementById('signupForm').addEventListener('submit', async event => {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const err = document.getElementById('signupError');
  const form = document.getElementById('signupForm'), btn = document.getElementById('signupBtn');
  err.classList.remove('show');

  const fail = m => { err.textContent = m; err.classList.add('show'); };
  if (username.length < 3) return fail('Username must be at least 3 characters.');
  if (!email) return fail('Enter your email address.');
  if (!password) return fail('Enter a password.');
  if (password !== confirm) return fail('Passwords do not match.');

  form.classList.add('submitting'); btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/admin/signup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, confirm_password: confirm })
    });
    let result = {};
    try { result = await res.json(); } catch (e) {}
    if (result.success) {
      form.style.display = 'none';
      document.getElementById('signupFoot').style.display = 'none';
      document.getElementById('waitingWho').textContent = 'Username: ' + username;
      setIcon(document.getElementById('spIcon'), 'waiting');
      document.getElementById('waitingPanel').classList.add('show');
    } else {
      fail(result.message || 'Could not create the account.');
    }
  } catch (e) {
    fail('Could not reach the server. Please try again.');
  } finally {
    form.classList.remove('submitting'); btn.disabled = false;
  }
});
</script>
</body>
</html>
